<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dead Signal — Character lineup</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8dfcb;color:#202820;font-family:Arial,sans-serif;padding:48px 6vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #202820;padding-bottom:20px}header b{letter-spacing:3px;font-size:13px}a{color:inherit;font-size:12px;font-weight:bold}small{display:block;letter-spacing:3px;font:10px monospace;margin-top:38px}h1{font-size:clamp(36px,6vw,76px);line-height:1;letter-spacing:-3px;margin:15px 0}p{line-height:1.6;color:#56604d;font-size:14px}.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:26px}figure{margin:0;text-align:center;border:1px solid #20282033;background:#f3ecdc;padding:20px 12px}canvas{width:100%;max-width:256px;height:auto}figcaption{border-top:1px solid #20282033;padding-top:18px;font-weight:800;font-size:18px}figcaption span{display:block;font:10px monospace;letter-spacing:1px;margin-top:8px;color:#69745a}footer{margin-top:28px;font:11px monospace;color:#56604d}@media(max-width:600px){body{padding:28px 5vw}.lineup{gap:8px}figure{padding:8px 2px}figcaption{font-size:12px}figcaption span{font-size:8px}h1{letter-spacing:-1px}}</style></head>
<body><header><b>╋ DEAD SIGNAL</b><a href="./">PLAY THE GAME ↗</a></header><small>OUTPOST 07 / CHARACTER STUDIES</small><h1>A different kind of hostile.</h1><p>Big expressions. Heavy ink. Paper-thin soldiers. Field-ready weapons.</p><div class="lineup"><figure><canvas width="256" height="384" aria-label="Olive-uniformed cartoon soldier with round head, freckles and helmet"></canvas><figcaption>The Rookie<span>OLIVE / OVERCONFIDENT</span></figcaption></figure><figure><canvas width="256" height="384" aria-label="Khaki-uniformed cartoon veteran with a field cap"></canvas><figcaption>The Old Hand<span>KHAKI / UNIMPRESSED</span></figcaption></figure><figure><canvas width="256" height="384" aria-label="Blue-uniformed cartoon radio operator with a headset"></canvas><figcaption>The Operator<span>SLATE / OFF THE AIR</span></figcaption></figure></div><footer>Original animated cutouts · Two-sided sprites in a 3D world</footer><script type="module">import {drawEnemy} from './enemy-art.js?v=permanent-1';const canvases=[...document.querySelectorAll('canvas')];function frame(time){for(const [i,c] of canvases.entries()){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);drawEnemy(ctx,Math.floor(time/100)%8,i);}requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></body></html>
